name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      node_cache_key: ${{ steps.node-cache.outputs.cache-primary-key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/web/node_modules
            packages/shared/node_modules
          key: ${{ needs.install.outputs.node_cache_key }}

      - name: Typecheck shared package
        run: npm run build -w @researchly/shared

      - name: Lint
        run: npm run lint -w web

      - name: Typecheck
        run: npm run typecheck -w web

      - name: Test (parallel via vitest)
        run: npm run test -w web -- run

      - name: Build
        run: npm run build -w web

  backend:
    name: Backend (Lint, Test)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Ruff Lint Check
        run: ruff check apps/api

      - name: Test (parallel with pytest-xdist)
        run: |
          cd apps/api
          pip install pytest-xdist
          python -m pytest tests -n auto --tb=short